# Deploys the Marketing App to a specific Github Environment.
# See Marketing-App-Deploy for the parent workflow that provides the matrix inputs to this reusable workflow.

# The name does not use spaces due to https://github.com/integrations/slack/issues/1790
name: Marketing-App-Deploy-To-Environment

# Configures this workflow to run every time a change is pushed to `frontend`
on:
  # Manual dispatch inputs are restricted to choices so they cannot carry arbitrary text. The
  # validate-inputs job below re-checks every input (including for workflow_call) before any job
  # that touches a GitHub Environment, its secrets or AWS credentials can start.
  workflow_dispatch:
    inputs:
      ENVIRONMENT_TYPE:
        description: "The type of environment to deploy to, e.g. 'test' or 'production'."
        required: true
        type: choice
        options:
          - test
          - production
      SITE_TYPE:
        description: "The type of site to deploy, e.g. 'csforall' or 'corporate'."
        required: true
        type: choice
        options:
          - aiday
          - corporate
          - csforall
          - hourofai
      CONTAINER_IMAGE_DIGEST:
        description: 'The sha256 digest of the container image to deploy, e.g. sha256:<64 lowercase hex characters>.'
        required: true
        type: string
  workflow_call:
    inputs:
      ENVIRONMENT_TYPE:
        description: "The type of environment to deploy to, e.g. 'test' or 'production'."
        required: true
        type: string
      SITE_TYPE:
        description: "The type of site to deploy, e.g. 'csforall' or 'corporate'."
        required: true
        type: string
      CONTAINER_IMAGE_DIGEST:
        description: 'The sha256 digest of the container image to deploy.'
        required: true
        type: string

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: code-dot-org/marketing
  GITHUB_ENVIRONMENT_NAME: marketing-sites-${{ inputs.ENVIRONMENT_TYPE }}-${{ inputs.SITE_TYPE }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  # Job: validate-inputs
  # Rejects any input outside the known allowlist before the deploy job selects a GitHub Environment,
  # receives its secrets, or assumes the deployer IAM role. This job deliberately has no `environment`
  # and no extra permissions. Inputs reach the script only through `env`, never through `${{ }}`
  # interpolation inside `run:`, so a malicious value cannot inject shell.
  validate-inputs:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Validate deploy inputs
        env:
          ENVIRONMENT_TYPE: ${{ inputs.ENVIRONMENT_TYPE }}
          SITE_TYPE: ${{ inputs.SITE_TYPE }}
          CONTAINER_IMAGE_DIGEST: ${{ inputs.CONTAINER_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          errors=0

          case "$ENVIRONMENT_TYPE" in
            test|production) ;;
            *) echo "::error::ENVIRONMENT_TYPE must be one of: test, production"; errors=1 ;;
          esac

          case "$SITE_TYPE" in
            aiday|corporate|csforall|hourofai) ;;
            *) echo "::error::SITE_TYPE must be one of: aiday, corporate, csforall, hourofai"; errors=1 ;;
          esac

          # Matches the `digest` output of docker/build-push-action in marketing-app-deploy.yml, which
          # CloudFormation consumes as ghcr.io/code-dot-org/marketing@<digest>.
          if [[ ! "$CONTAINER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::CONTAINER_IMAGE_DIGEST must match ^sha256:[0-9a-f]{64}\$"
            errors=1
          fi

          if [[ "$errors" -ne 0 ]]; then
            exit 1
          fi

          echo "Inputs OK: marketing-sites-$ENVIRONMENT_TYPE-$SITE_TYPE @ $CONTAINER_IMAGE_DIGEST"

  # Job: deploy
  # This job pulls the task definition for the current task running in the cluster and updates the docker image tag with the one built in the previous job
  # Then, the task definition is deployed to the ECS service
  # See: https://docs.github.com/en/actions/use-cases-and-examples/deploying/deploying-to-amazon-elastic-container-service
  deploy:
    needs:
      - validate-inputs
    runs-on: ubuntu-24.04
    environment: marketing-sites-${{ inputs.ENVIRONMENT_TYPE }}-${{ inputs.SITE_TYPE }}

    permissions:
      # Allows Github to retrieve AWS credentials via OIDC
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#adding-permissions-settings
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ruby/setup-ruby@eaecf785f6a34567a6d97f686bbb7bccc1ac1e5c # v1.237.0
        with:
          working-directory: ./apps/marketing/cicd
          bundler-cache: true

      # Warning: Use minimal permissions for the deployer
      # See: https://github.com/aws-actions/amazon-ecs-deploy-task-definition?tab=readme-ov-file#permissions
      - name: Configure ECS/Github Deployer AWS credentials
        uses: aws-actions/configure-aws-credentials@f24d7193d98baebaeacc7e2227925dd47cc267f5 # v4.2.0
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_DEPLOYER_IAM_ROLE_ARN }}
          role-session-name: GithubActions-${{ env.GITHUB_ENVIRONMENT_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      # The static/ tree was extracted from the pushed image, injected with Sentry debug IDs, and uploaded to
      # Sentry (all once) by the parent workflow's `prepare-static-assets` job. We download the same artifact
      # here so every environment's S3 bucket gets byte-identical content, matching the source maps uploaded
      # to Sentry. No docker pull needed in this job.
      - name: 'Download static assets artifact'
        uses: actions/download-artifact@v4
        with:
          name: marketing-static-${{ github.run_id }}
          path: ./static

      - name: '[${{ env.GITHUB_ENVIRONMENT_NAME }}] Upload Static Assets to S3'
        env:
          BASE_DOMAIN: ${{ vars.APPLICATION_BASE_DOMAIN }}
          SUBDOMAIN_NAME: ${{ vars.APPLICATION_SUBDOMAIN_NAME }}
        run: |
          BUCKET_NAME="$SUBDOMAIN_NAME.$BASE_DOMAIN-static-assets"

          echo "Uploading static assets to $BUCKET_NAME"

          # Upload to S3 and set the cache control for these static assets to be immutable.
          # More details: https://nextjs.org/docs/app/guides/self-hosting#automatic-caching
          aws s3 sync static/ "s3://$BUCKET_NAME/_next/static" --quiet --cache-control "public, max-age=31536000, immutable"

      - name: '[${{ env.GITHUB_ENVIRONMENT_NAME }}] Deploy Marketing App to AWS'
        working-directory: ./apps/marketing/cicd/3-app
        # All values are passed through env and quoted as shell variables. Never interpolate `${{ }}`
        # expressions (especially inputs) directly into this script.
        env:
          DEPLOY_ENVIRONMENT_TYPE: ${{ vars.ENVIRONMENT_TYPE }}
          DEPLOY_SITE_TYPE: ${{ vars.SITE_TYPE }}
          DEPLOY_AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_HOSTED_ZONE_ID: ${{ secrets.ROOT_HOSTED_ZONE_ID }}
          APPLICATION_BASE_DOMAIN: ${{ vars.APPLICATION_BASE_DOMAIN }}
          APPLICATION_SUBDOMAIN_NAME: ${{ vars.APPLICATION_SUBDOMAIN_NAME }}
          CONTAINER_IMAGE_DIGEST: ${{ inputs.CONTAINER_IMAGE_DIGEST }}
          CLOUDFORMATION_DEPLOYER_ROLE_ARN: ${{ secrets.CLOUDFORMATION_DEPLOYER_ROLE_ARN }}
          APPLICATION_SERVER_SECRETS_ARN: ${{ secrets.APPLICATION_SERVER_SECRETS_ARN }}
          CLOUDFORMATION_ROLE_BOUNDARY_ARN: ${{ secrets.CLOUDFORMATION_ROLE_BOUNDARY_ARN }}
          PRODUCTION_DOMAIN_NAME: ${{ vars.PRODUCTION_DOMAIN_NAME }}
          PRODUCTION_HOSTED_ZONE_ID: ${{ secrets.PRODUCTION_HOSTED_ZONE_ID }}
          WEB_APPLICATION_FIREWALL_ARN: ${{ secrets.WEB_APPLICATION_FIREWALL_ARN }}
        run: |
          bundle exec ruby deploy.rb --environment_type "$DEPLOY_ENVIRONMENT_TYPE" \
            --site_type "$DEPLOY_SITE_TYPE" \
            --region "$DEPLOY_AWS_REGION" \
            --hosted_zone_id "$ROOT_HOSTED_ZONE_ID" \
            --base_domain_name "$APPLICATION_BASE_DOMAIN" \
            --subdomain_name "$APPLICATION_SUBDOMAIN_NAME" \
            --container_image_hash "$CONTAINER_IMAGE_DIGEST" \
            --role_arn "$CLOUDFORMATION_DEPLOYER_ROLE_ARN" \
            --web_application_server_secrets_arn "$APPLICATION_SERVER_SECRETS_ARN" \
            --cloudformation_role_boundary "$CLOUDFORMATION_ROLE_BOUNDARY_ARN" \
            --production_domain_name "$PRODUCTION_DOMAIN_NAME" \
            --production_hosted_zone_id "$PRODUCTION_HOSTED_ZONE_ID" \
            --web-application-firewall "$WEB_APPLICATION_FIREWALL_ARN"

  ui-tests:
    runs-on: ubuntu-24.04
    environment: marketing-sites-${{ inputs.ENVIRONMENT_TYPE }}-${{ inputs.SITE_TYPE }}
    needs:
      - deploy

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        # shardTotal is used to determine how many shards there are in total.
        shardTotal: [4]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build
        run: yarn build --filter @code-dot-org/marketing
        working-directory: ./

      - name: UI Tests
        uses: ./.github/actions/frontend/marketing/ui-tests
        with:
          ENVIRONMENT_TYPE: ${{ vars.ENVIRONMENT_TYPE }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY}}
          APPLICATION_BASE_ADDRESS: '${{ vars.APPLICATION_SUBDOMAIN_NAME }}.${{ vars.APPLICATION_BASE_DOMAIN }}'
          DRAFT_MODE_TOKEN: ${{ secrets.DRAFT_MODE_TOKEN }}
          GITHUB_ENVIRONMENT_NAME: ${{ env.GITHUB_ENVIRONMENT_NAME }}
          SITE_TYPE: ${{ inputs.SITE_TYPE }}
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}

  merge-reports:
    needs: [ui-tests]

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Merge Playwright Reports
        uses: ./.github/actions/frontend/merge-playwright-reports
        with:
          GITHUB_ENVIRONMENT_NAME: ${{ env.GITHUB_ENVIRONMENT_NAME }}
