# State of Digital Fluency data pipeline (proof of concept).
#
# Reads the Advocacy team's Google Sheet with keyless, read-only credentials
# (Workload Identity Federation), runs placeholder Python, validates the result
# against pipelines/sodf/schema, and optionally writes it to one Contentful
# entry as a DRAFT. It never publishes. Setup: pipelines/sodf/README.md.
name: SODF data pipeline

on:
  workflow_dispatch:
    inputs:
      write_to_contentful:
        description: 'Write the validated JSON to the Contentful envelope entry as a draft (never publishes)'
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time so two triggers can't interleave Contentful writes.
concurrency:
  group: sodf-data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Read sheet, validate, write draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the SODF_* variables and the Contentful secret. Tighten to `main`
    # (deployment branch rule, optional reviewers) before launch.
    environment: sodf-data-pipeline
    permissions:
      contents: read
      id-token: write # Needed to request the GitHub OIDC token for Google.
    defaults:
      run:
        working-directory: pipelines/sodf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: pipelines/sodf/.python-version
          cache: pip
          cache-dependency-path: pipelines/sodf/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt

      - name: Authenticate to Google (read-only, keyless)
        uses: google-github-actions/auth@7b53cdc2a387814ed14eec026287aac689ae8c9b # v2.1.9
        with:
          workload_identity_provider: ${{ vars.SODF_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SODF_GCP_SERVICE_ACCOUNT }}
          # Writes a short-lived external-account credentials file and sets
          # GOOGLE_APPLICATION_CREDENTIALS, so google.auth.default() finds it.
          # The Python requests only the spreadsheets.readonly scope.
          create_credentials_file: true

      - name: Read sheet, transform, validate
        env:
          SODF_SPREADSHEET_ID: ${{ vars.SODF_SPREADSHEET_ID }}
          SODF_RANGES: ${{ vars.SODF_RANGES }}
          SODF_HEADER_ROW: ${{ vars.SODF_HEADER_ROW || '2' }}
        run: python -m sodf_pipeline build --output "$RUNNER_TEMP/sodf-envelope.json"

      - name: Write draft to Contentful
        if: ${{ inputs.write_to_contentful }}
        env:
          # Google credentials aren't needed past this point.
          GOOGLE_APPLICATION_CREDENTIALS: ''
          CONTENTFUL_SPACE_ID: ${{ vars.SODF_CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT_ID: ${{ vars.SODF_CONTENTFUL_ENVIRONMENT_ID }}
          CONTENTFUL_ENTRY_ID: ${{ vars.SODF_CONTENTFUL_ENTRY_ID }}
          CONTENTFUL_CONTENT_TYPE_ID: ${{ vars.SODF_CONTENTFUL_CONTENT_TYPE_ID || 'stateOfDigitalFluencyData' }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.SODF_CONTENTFUL_MANAGEMENT_TOKEN }}
        run: python -m sodf_pipeline write --input "$RUNNER_TEMP/sodf-envelope.json"
